<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · FitZone Gym Booking</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/app.js" defer></script>
</head>
<body data-page="register">
<header class="nav" id="nav"></header>
<main class="wrap">
  <div class="narrow card">
    <h2>Create your account</h2>
    <p class="muted">One account to book, cancel and see your history.</p>
    <form id="form" autocomplete="on">
      <label for="full_name">Full name</label>
      <input id="full_name" name="name" type="text" required minlength="2" maxlength="100" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="100" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
      <div class="pw-rules" id="pw-rules"></div>
      <label for="plan_id">Membership plan</label>
      <select id="plan_id" name="plan"></select>
      <button class="btn form-btn" type="submit">Sign up</button>
      <div id="msg" class="msg"></div>
    </form>
    <p class="hint">We store only your name, email, phone and a password hash. No card data. <br>Already registered? <a href="/">Log in</a></p>
  </div>
</main>
</body>
</html>
